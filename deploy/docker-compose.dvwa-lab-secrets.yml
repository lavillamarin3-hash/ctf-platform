# Overlay opt-in para ESC-03-WEBEXPLOIT.
# Las rutas *_HOST se definen solo en el .env privado de LAB-CTFWEB.
services:
  api:
    volumes:
      - ${DVWA_LAB_SSH_PRIVATE_KEY_HOST:?Configure una clave privada de SRVWEB}:/run/secrets/dvwa_lab_ssh_key:ro
      - ${DVWA_LAB_KNOWN_HOSTS_HOST:?Configure known_hosts de SRVWEB}:/run/secrets/dvwa_lab_known_hosts:ro
