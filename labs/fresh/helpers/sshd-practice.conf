# LAB-LNXVICT: instancia separada de sshd, solo puerto didáctico.
Port 2222
ListenAddress 10.10.30.12
PidFile /run/sshd-cociber.pid
HostKey /etc/ssh/ssh_host_ed25519_key
PasswordAuthentication yes
PubkeyAuthentication no
PermitRootLogin no
UsePAM yes
AllowGroups cociber-ssh
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
AllowAgentForwarding no
PermitUserEnvironment no
MaxAuthTries 3
LogLevel INFO
